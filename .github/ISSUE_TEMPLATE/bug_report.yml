name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Security problem? Please **don't** open an issue — see [SECURITY.md](https://github.com/Gabbo65/rove/blob/main/SECURITY.md)."
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open …\n2. Click …\n3. See …"
  - type: input
    id: version
    attributes:
      label: Rove version
      description: Settings → About
      placeholder: "0.1.1"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: System
      options: [Windows, macOS (Apple chip), macOS (Intel), Linux]
    validations:
      required: true
