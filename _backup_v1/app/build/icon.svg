<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1fb6e0"/>
      <stop offset=".55" stop-color="#0f6cbd"/>
      <stop offset="1" stop-color="#2a3fa8"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0b2a5e" flood-opacity=".35"/>
    </filter>
  </defs>
  <!-- macOS icon grid: 824px rounded square centred in 1024 -->
  <g filter="url(#sh)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#bg)"/>
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#shine)"/>
  </g>
  <!-- globe -->
  <g fill="none" stroke="#fff" stroke-width="34" stroke-linecap="round" opacity=".95">
    <circle cx="470" cy="500" r="210"/>
    <ellipse cx="470" cy="500" rx="92" ry="210"/>
    <path d="M272 430h396M272 570h396"/>
  </g>
  <!-- phone remote, overlapping bottom-right -->
  <g filter="url(#sh)">
    <rect x="600" y="520" width="190" height="300" rx="40" fill="#fff"/>
    <rect x="626" y="560" width="138" height="200" rx="14" fill="#0f6cbd" opacity=".9"/>
    <circle cx="695" cy="790" r="12" fill="#0f6cbd" opacity=".55"/>
    <!-- signal waves -->
    <path d="M665 640q30-30 60 0M650 615q45-45 90 0" fill="none" stroke="#fff" stroke-width="14" stroke-linecap="round"/>
    <circle cx="695" cy="668" r="11" fill="#fff"/>
  </g>
</svg>
