<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src data: https: http:; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
<title>History</title>
<style>
  :root { --bg: #f7f7f8; --fg: #1b1b1f; --muted: #6e6e76; --card: #fff; --line: #e3e3e6; --hover: rgba(0,0,0,.05);
    --accent: #0f6cbd; --danger: #c42b1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #262626; --fg: #f0f0f0; --muted: #a3a3a8; --card: #2f2f2f; --line: #3d3d3d; --hover: rgba(255,255,255,.06);
      --accent: #4ca0f0; --danger: #ff6b5e; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); font: 13px -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
  main { max-width: 860px; margin: 0 auto; padding: 32px 24px 60px; }
  header { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
  h1 { font-size: 24px; font-weight: 600; margin: 0; flex: 1; }
  .search { display: flex; align-items: center; gap: 8px; height: 36px; width: 320px; padding: 0 12px; border-radius: 18px;
    background: var(--card); box-shadow: 0 0 0 1px var(--line); }
  .search:focus-within { box-shadow: 0 0 0 2px var(--accent); }
  .search svg { width: 15px; height: 15px; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; flex: none; }
  .search input { flex: 1; border: none; outline: none; background: transparent; color: var(--fg); font: inherit; font-size: 13px; }
  button { font: inherit; color: inherit; border: none; background: transparent; border-radius: 6px; cursor: default; }
  .btn { padding: 7px 12px; font-weight: 500; }
  .btn:hover { background: var(--hover); }
  .btn.danger { color: var(--danger); }
  .bulk { display: none; align-items: center; gap: 8px; padding: 8px 12px; margin-bottom: 12px; border-radius: 10px;
    background: color-mix(in srgb, var(--accent) 12%, transparent); }
  .bulk.on { display: flex; }
  .bulk span { flex: 1; font-weight: 500; }
  section { background: var(--card); border-radius: 12px; box-shadow: 0 0 0 1px var(--line); margin-bottom: 18px; overflow: hidden; }
  h2 { font-size: 13px; font-weight: 600; margin: 0; padding: 12px 16px 6px; }
  .row { display: flex; align-items: center; gap: 12px; padding: 6px 10px 6px 16px; min-height: 40px; }
  .row:hover { background: var(--hover); }
  .row input[type=checkbox] { margin: 0; accent-color: var(--accent); opacity: 0; }
  .row:hover input[type=checkbox], .row input:checked, body.selecting .row input[type=checkbox] { opacity: 1; }
  .time { color: var(--muted); font-size: 12px; width: 46px; flex: none; font-variant-numeric: tabular-nums; }
  .fav { width: 16px; height: 16px; flex: none; border-radius: 3px; display: grid; place-items: center;
    font-size: 9px; font-weight: 700; color: #fff; background: var(--accent); text-transform: uppercase; overflow: hidden; }
  .fav img { width: 16px; height: 16px; }
  .fav.img { background: transparent; }
  a { flex: 1; min-width: 0; display: flex; gap: 8px; align-items: baseline; color: var(--fg); text-decoration: none; }
  a .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  a .d { color: var(--muted); font-size: 12px; white-space: nowrap; flex: none; }
  a:hover .t { text-decoration: underline; }
  .del { width: 28px; height: 28px; display: grid; place-items: center; opacity: 0; flex: none; }
  .row:hover .del { opacity: .7; }
  .del:hover { background: var(--hover); opacity: 1 !important; }
  .del svg { width: 12px; height: 12px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; }
  #empty { color: var(--muted); text-align: center; padding: 60px 0; font-size: 14px; }
  #more { display: block; margin: 0 auto; }
  [hidden] { display: none !important; }
  mark { background: color-mix(in srgb, var(--accent) 30%, transparent); color: inherit; border-radius: 2px; }
</style>
</head>
<body>
<main>
  <header>
    <h1>History</h1>
    <label class="search">
      <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
      <input id="q" placeholder="Search history" autocomplete="off" autofocus>
    </label>
    <button class="btn danger" id="clear">Clear browsing history</button>
  </header>
  <div class="bulk" id="bulk"><span id="bulk-count"></span>
    <button class="btn" id="bulk-cancel">Cancel</button><button class="btn danger" id="bulk-delete">Delete</button></div>
  <div id="list"></div>
  <div id="empty" hidden>No history yet</div>
  <button class="btn" id="more" hidden>Show more</button>
</main>
<script>
  const PAGE = 300;
  let all = [], shown = PAGE;
  const selected = new Set();
  const $ = (id) => document.getElementById(id);
  const keyOf = (h) => h.t + '|' + h.url;

  const dayLabel = (t) => {
    const d = new Date(t), today = new Date(); today.setHours(0, 0, 0, 0);
    const day = new Date(d); day.setHours(0, 0, 0, 0);
    const diff = Math.round((today - day) / 864e5);
    if (diff === 0) return 'Today';
    if (diff === 1) return 'Yesterday';
    return d.toLocaleDateString(undefined, { weekday: 'long', month: 'long', day: 'numeric',
      year: d.getFullYear() === today.getFullYear() ? undefined : 'numeric' });
  };
  const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return u; } };

  function highlight(el, text, q) {
    if (!q) { el.textContent = text; return; }
    const i = text.toLowerCase().indexOf(q);
    if (i < 0) { el.textContent = text; return; }
    const m = document.createElement('mark'); m.textContent = text.slice(i, i + q.length);
    el.replaceChildren(text.slice(0, i), m, text.slice(i + q.length));
  }

  function render() {
    const q = $('q').value.trim().toLowerCase();
    const items = q ? all.filter((h) => (h.title || '').toLowerCase().includes(q) || h.url.toLowerCase().includes(q)) : all;
    const list = $('list');
    const frag = document.createDocumentFragment();
    let section = null, lastDay = null;
    for (const h of items.slice(0, shown)) {
      const label = dayLabel(h.t);
      if (label !== lastDay) {
        section = document.createElement('section');
        const h2 = document.createElement('h2'); h2.textContent = label;
        section.append(h2); frag.append(section); lastDay = label;
      }
      const row = document.createElement('div'); row.className = 'row';
      const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = selected.has(keyOf(h));
      cb.onchange = () => { cb.checked ? selected.add(keyOf(h)) : selected.delete(keyOf(h)); updateBulk(); };
      const time = document.createElement('span'); time.className = 'time';
      time.textContent = new Date(h.t).toLocaleTimeString(undefined, { hour: '2-digit', minute: '2-digit' });
      const fav = document.createElement('span'); fav.className = 'fav';
      if (h.favicon) {
        const img = document.createElement('img'); img.src = h.favicon; fav.classList.add('img');
        img.onerror = () => { fav.classList.remove('img'); fav.textContent = host(h.url)[0] || '•'; };
        fav.append(img);
      } else fav.textContent = host(h.url)[0] || '•';
      const a = document.createElement('a'); a.href = h.url; a.title = h.url;
      const t = document.createElement('span'); t.className = 't'; highlight(t, h.title || h.url, q);
      const d = document.createElement('span'); d.className = 'd'; highlight(d, host(h.url), q);
      a.append(t, d);
      const del = document.createElement('button'); del.className = 'del'; del.title = 'Delete';
      del.innerHTML = '<svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>';
      del.onclick = () => window.internal.send('delete-history', [{ t: h.t, url: h.url }]);
      row.append(cb, time, fav, a, del);
      section.append(row);
    }
    list.replaceChildren(frag);
    $('empty').hidden = items.length > 0;
    $('empty').textContent = q ? 'No matches' : 'No history yet';
    $('more').hidden = items.length <= shown;
  }

  function updateBulk() {
    $('bulk').classList.toggle('on', selected.size > 0);
    document.body.classList.toggle('selecting', selected.size > 0);
    $('bulk-count').textContent = `${selected.size} selected`;
  }

  $('q').addEventListener('input', () => { shown = PAGE; render(); });
  $('more').onclick = () => { shown += PAGE; render(); };
  $('clear').onclick = () => { if (confirm('Clear all browsing history?')) window.internal.send('clear-history'); };
  $('bulk-cancel').onclick = () => { selected.clear(); updateBulk(); render(); };
  $('bulk-delete').onclick = () => {
    const items = all.filter((h) => selected.has(keyOf(h))).map(({ t, url }) => ({ t, url }));
    selected.clear(); updateBulk();
    window.internal.send('delete-history', items);
  };

  window.internal.on((type, data) => {
    if (type === 'history') { all = data || []; render(); }
  });
  window.internal.send('get-history');
</script>
</body>
</html>
