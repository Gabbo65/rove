<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: https: http:; style-src 'self' 'unsafe-inline'">
<title>Browser</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Row 1: tab strip -->
  <div id="tabstrip">
    <div class="traffic-space"></div>
    <div id="tabs"></div>
    <button id="newtab" class="icon" title="New tab (⌘T)">
      <svg viewBox="0 0 16 16"><path d="M8 3v10M3 8h10"/></svg>
    </button>
    <div class="drag-fill"></div>
  </div>

  <!-- Row 2: toolbar -->
  <header id="toolbar">
    <button id="back" class="icon" title="Back (⌘[)"><svg viewBox="0 0 16 16"><path d="M13 8H3M7 4L3 8l4 4"/></svg></button>
    <button id="forward" class="icon" title="Forward (⌘])"><svg viewBox="0 0 16 16"><path d="M3 8h10M9 4l4 4-4 4"/></svg></button>
    <button id="reload" class="icon" title="Reload (⌘R)">
      <svg class="i-reload" viewBox="0 0 16 16"><path d="M13 8a5 5 0 1 1-1.5-3.6M13 2.5v3h-3"/></svg>
      <svg class="i-stop" viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg>
    </button>
    <form id="urlform">
      <span id="lock"></span>
      <input id="url" spellcheck="false" autocomplete="off" placeholder="Search or enter web address">
      <button type="button" id="star" class="icon" title="Add this page to favorites (⌘D)">
        <svg viewBox="0 0 16 16"><path d="M8 1.8l1.9 3.9 4.3.6-3.1 3 .7 4.3L8 11.6l-3.8 2 .7-4.3-3.1-3 4.3-.6z"/></svg>
      </button>
    </form>
    <button id="hist-btn" class="icon" title="History (⌘Y)">
      <svg viewBox="0 0 16 16"><path d="M2.6 8a5.4 5.4 0 1 0 1.6-3.8M2.5 2.5v2.7h2.7M8 5v3.2l2.2 1.4"/></svg>
    </button>
    <button id="dl-btn" class="icon" title="Downloads (⇧⌘J)" hidden>
      <svg viewBox="0 0 16 16"><path d="M8 2.5v8M4.5 7L8 10.5 11.5 7M3 13.5h10"/></svg>
    </button>
    <button id="remote-btn" title="Show or hide the phone QR code (⇧⌘Q)">
      <span class="dot"></span><span id="remote-label">No remote</span>
    </button>
  </header>

  <!-- Row 3: favorites bar -->
  <nav id="favbar"><div id="favs"></div><div id="fav-empty">Add pages with the ☆ in the address bar</div></nav>

  <main id="stage">
    <div id="loading"></div>
    <!-- Overlays: pointer-events none so they never block the page -->
    <div id="cursor" hidden></div>

    <div id="findbar" hidden>
      <input id="find-input" placeholder="Find on page" spellcheck="false" autocomplete="off">
      <span id="find-count"></span>
      <button id="find-prev" class="icon" title="Previous (⇧⌘G)"><svg viewBox="0 0 16 16"><path d="M4 10l4-4 4 4"/></svg></button>
      <button id="find-next" class="icon" title="Next (⌘G)"><svg viewBox="0 0 16 16"><path d="M4 6l4 4 4-4"/></svg></button>
      <button id="find-close" class="icon" title="Close (Esc)"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
    </div>

    <div id="dl-panel" hidden>
      <div class="dl-head">
        <span>Downloads</span>
        <button id="dl-clear" title="Remove finished downloads from the list">Clear</button>
        <button id="dl-close" class="icon" title="Close"><svg viewBox="0 0 16 16"><path d="M4 4l8 8M12 4l-8 8"/></svg></button>
      </div>
      <div id="dl-list"></div>
      <div id="dl-empty">No downloads yet</div>
    </div>
    <div id="hist-panel" class="popup" hidden>
      <div class="dl-head"><span>History</span></div>
      <div id="hp-list"></div>
      <div id="hp-empty">Pages you visit show up here</div>
      <button id="hp-more">Show more</button>
    </div>

    <div id="qr" hidden>
      <img id="qr-img" alt="QR code">
      <div class="qr-title" id="qr-title">Waiting for a device…</div>
      <div class="qr-sub">Scan with your iPhone</div>
      <div class="qr-addr" id="qr-addr"></div>
    </div>
  </main>

  <!-- Favorite edit popup (positioned under the ☆ or the favorite) -->
  <div id="fav-pop" hidden>
    <div id="fp-title">Edit favorite</div>
    <label>Name<input id="fp-name" spellcheck="false" autocomplete="off"></label>
    <label>URL<input id="fp-url" spellcheck="false" autocomplete="off"></label>
    <div class="fp-actions">
      <button id="fp-remove">Remove</button>
      <span></span>
      <button id="fp-cancel">Cancel</button>
      <button id="fp-save" class="primary">Done</button>
    </div>
  </div>

  <script src="renderer.js"></script>
</body>
</html>
