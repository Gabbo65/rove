<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Remote">
<title>Remote</title>
<style>
  :root { --bg:#f2f2f7; --card:#fff; --fg:#1d1d1f; --muted:#8e8e93; --line:#d1d1d6; --accent:#0a84ff; --ok:#34c759; --bad:#ff3b30; }
  @media (prefers-color-scheme: dark) { :root { --bg:#000; --card:#1c1c1e; --fg:#f5f5f7; --muted:#8e8e93; --line:#38383a; } }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg);
    font: 16px -apple-system, system-ui, sans-serif; overscroll-behavior: none; }
  body { display: flex; flex-direction: column; height: 100dvh; gap: 10px;
    padding: max(10px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom)); }
  button { font: inherit; color: inherit; border: none; background: var(--card); border-radius: 10px; }
  button:active { opacity: .55; }
  button:disabled { opacity: .3; }

  .top { display: flex; align-items: center; gap: 10px; }
  .status { display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); flex: 1; min-width: 0; }
  .status .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); flex: none; }
  .status.on .dot { background: var(--ok); }
  #title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .seg { display: flex; background: rgba(118,118,128,.18); border-radius: 9px; padding: 2px; flex: none; }
  .seg button { background: transparent; padding: 6px 12px; font-size: 13px; font-weight: 500; border-radius: 7px; }
  .seg button.on { background: var(--card); box-shadow: 0 1px 3px rgba(0,0,0,.15); }

  .nav { display: flex; gap: 6px; }
  .nav button { width: 42px; height: 40px; font-size: 22px; flex: none; }
  .nav form { flex: 1; min-width: 0; display: flex; }
  .nav button { width: 40px !important; }
  .nav input { flex: 1; min-width: 0; height: 40px; border: none; border-radius: 10px; background: var(--card);
    color: var(--fg); padding: 0 12px; font-size: 16px; outline: none; }

  .pane { flex: 1; min-height: 0; position: relative; border-radius: 16px; overflow: hidden; }
  #pad { background: var(--card); touch-action: none; display: flex; align-items: center; justify-content: center; }
  #pad .hint { color: var(--muted); font-size: 13px; text-align: center; line-height: 1.7; pointer-events: none; }
  #pad.active { background: color-mix(in srgb, var(--card) 85%, var(--accent)); }
  #mirror { background: #000; touch-action: none; display: flex; align-items: center; justify-content: center; }
  #frame { max-width: 100%; max-height: 100%; display: block; user-select: none; -webkit-user-drag: none; pointer-events: none; }
  #mirror .hint { position: absolute; color: #8e8e93; font-size: 13px; }
  .ripple { position: absolute; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%;
    border: 2px solid var(--accent); pointer-events: none; animation: rip .4s ease-out forwards; }
  @keyframes rip { from { transform: scale(.4); opacity: 1; } to { transform: scale(1.4); opacity: 0; } }

  .keys { display: flex; gap: 6px; }
  .keys input { flex: 1; min-width: 0; height: 44px; border: none; border-radius: 10px; background: var(--card);
    color: var(--fg); padding: 0 12px; font-size: 16px; outline: none; }
  .keys button { height: 44px; padding: 0 14px; font-size: 15px; flex: none; }
  #favs-btn { width: 42px; height: 40px; flex: none; font-size: 21px; line-height: 1; }
  .favadd.on { color: #ff9f0a !important; }
  #tabs-btn { width: 42px; height: 40px; flex: none; display: grid; place-items: center; }
  #tabs-btn span { min-width: 22px; height: 22px; padding: 0 4px; border: 2px solid currentColor; border-radius: 6px;
    font-size: 12px; font-weight: 700; display: grid; place-items: center; line-height: 1; }

  /* Tab sheet */
  .sheet { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.35); display: flex; align-items: flex-end;
    animation: fade .2s; }
  .sheet .panel { width: 100%; max-height: 82dvh; display: flex; flex-direction: column; background: var(--bg);
    border-radius: 16px 16px 0 0; box-shadow: 0 -1px 0 var(--line), 0 -8px 30px rgba(0,0,0,.3); padding: 14px 12px max(12px, env(safe-area-inset-bottom)); animation: up .25s ease-out; }
  .sheet .head { display: flex; align-items: center; gap: 8px; padding: 0 4px 12px; }
  .sheet .head b { flex: 1; font-size: 17px; }
  .sheet .head button { padding: 8px 12px; font-weight: 600; color: var(--accent); background: transparent; }
  #tablist, #favlist { overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }
  .trow { display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: var(--card);
    border: 2px solid transparent; }
  .trow.active { border-color: var(--accent); }
  .trow .fi { width: 28px; height: 28px; border-radius: 7px; flex: none; display: grid; place-items: center; overflow: hidden;
    background: var(--line); font-weight: 700; font-size: 13px; text-transform: uppercase; color: var(--muted); }
  .trow .fi img { width: 20px; height: 20px; }
  .trow .tx { flex: 1; min-width: 0; }
  .trow .tt { font-size: 15px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .trow .tu { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-top: 2px; }
  .trow .x { width: 36px; height: 36px; flex: none; font-size: 18px; color: var(--muted); background: transparent; }
  @keyframes fade { from { opacity: 0; } }
  @keyframes up { from { transform: translateY(40%); opacity: .4; } }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <div class="top">
    <div class="status" id="status"><span class="dot"></span><span id="title">Connecting…</span></div>
    <div class="seg" id="seg">
      <button data-mode="basic" class="on">Basic</button>
      <button data-mode="advanced">Advanced</button>
    </div>
  </div>

  <div class="nav">
    <button id="back" aria-label="Back">‹</button>
    <button id="fwd" aria-label="Forward">›</button>
    <form id="urlform"><input id="url" type="url" inputmode="url" placeholder="Search or enter website"
      autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" enterkeyhint="go"></form>
    <button id="reload" aria-label="Reload" style="font-size:18px">↻</button>
    <button id="favs-btn" aria-label="Favorites">☆</button>
    <button id="tabs-btn" aria-label="Tabs"><span id="tab-count">1</span></button>
  </div>

  <div class="pane" id="pad">
    <div class="hint">Drag to move · Tap to click<br>Two fingers to scroll</div>
  </div>
  <div class="pane" id="mirror" hidden>
    <img id="frame" alt="">
    <div class="hint" id="mirror-hint">Waiting for picture…</div>
  </div>

  <div class="keys">
    <input id="type" placeholder="Type into page…" autocomplete="off" autocorrect="off"
      autocapitalize="off" spellcheck="false" enterkeyhint="send">
    <button id="bksp" aria-label="Delete">⌫</button>
    <button id="enter">Enter</button>
  </div>

  <div id="favsheet" class="sheet" hidden>
    <div class="panel">
      <div class="head"><button id="fav-add" class="favadd">☆ Add page</button><b></b><button id="favsheet-done">Done</button></div>
      <div id="favlist"></div>
    </div>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div class="panel">
      <div class="head"><button id="sheet-new">＋ New Tab</button><b></b><button id="sheet-done">Done</button></div>
      <div id="tablist"></div>
    </div>
  </div>

<script>
// ---------- connection ----------
const params = new URLSearchParams(location.search);
let key = params.get('k');
try { if (key) localStorage.setItem('k', key); else key = localStorage.getItem('k'); } catch {}

let ws, mode = 'basic';
const $ = (id) => document.getElementById(id);
const send = (msg) => ws && ws.readyState === 1 && ws.send(JSON.stringify(msg));

function connect() {
  ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws?k=${encodeURIComponent(key || '')}`);
  ws.binaryType = 'blob';
  ws.onopen = () => { $('status').classList.add('on'); sendMode(); };
  ws.onclose = (e) => {
    $('status').classList.remove('on');
    if (e.code === 4001) { $('title').textContent = 'Wrong key — scan the QR code again'; return; }
    $('title').textContent = 'Reconnecting…';
    setTimeout(connect, 1500);
  };
  ws.onmessage = (e) => {
    if (typeof e.data !== 'string') return showFrame(e.data);
    const msg = JSON.parse(e.data);
    if (msg.type === 'state') {
      currentUrl = msg.url || ''; renderFavs();
      $('title').textContent = msg.title || msg.url || 'Connected';
      if (document.activeElement !== $('url')) $('url').value = msg.url || '';
      $('back').disabled = !msg.canBack;
      $('fwd').disabled = !msg.canForward;
    }
    if (msg.type === 'tabs') { tabList = msg.tabs || []; renderTabs(); }
    if (msg.type === 'favorites') { favList = msg.favorites || []; renderFavs(); }
  };
}

// Mirror runs only while Advanced is showing AND this tab is visible.
function sendMode() {
  send({ type: 'mode', mode: document.hidden ? 'basic' : mode });
}
document.addEventListener('visibilitychange', sendMode);

$('seg').addEventListener('click', (e) => {
  const b = e.target.closest('button'); if (!b) return;
  mode = b.dataset.mode;
  for (const x of $('seg').children) x.classList.toggle('on', x === b);
  $('pad').hidden = mode !== 'basic';
  $('mirror').hidden = mode !== 'advanced';
  if (mode === 'basic') { $('frame').removeAttribute('src'); $('mirror-hint').hidden = false; }
  sendMode();
});

// ---------- tabs ----------
let tabList = [];
const host = (u) => { try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return ''; } };
function renderTabs() {
  $('tab-count').textContent = tabList.length > 99 ? ':D' : tabList.length;
  $('tablist').replaceChildren(...tabList.map((t) => {
    const row = document.createElement('div');
    row.className = 'trow' + (t.active ? ' active' : '');
    const fi = document.createElement('div'); fi.className = 'fi';
    const letter = (host(t.url) || t.title || '•')[0];
    if (t.favicon) { const img = document.createElement('img'); img.src = t.favicon; img.onerror = () => { fi.textContent = letter; }; fi.append(img); }
    else fi.textContent = letter;
    const tx = document.createElement('div'); tx.className = 'tx';
    const tt = document.createElement('div'); tt.className = 'tt'; tt.textContent = t.title || 'New Tab';
    const tu = document.createElement('div'); tu.className = 'tu'; tu.textContent = host(t.url);
    tx.append(tt, tu);
    const x = document.createElement('button'); x.className = 'x'; x.textContent = '✕'; x.setAttribute('aria-label', 'Close tab');
    x.onclick = (e) => { e.stopPropagation(); send({ type: 'tab', action: 'close', id: t.id }); };
    row.onclick = () => { send({ type: 'tab', action: 'select', id: t.id }); $('sheet').hidden = true; };
    row.append(fi, tx, x);
    return row;
  }));
}
$('tabs-btn').onclick = () => { renderTabs(); $('sheet').hidden = false; };
$('sheet-done').onclick = () => { $('sheet').hidden = true; };
$('sheet').addEventListener('click', (e) => { if (e.target.id === 'sheet') $('sheet').hidden = true; });
$('sheet-new').onclick = () => { send({ type: 'tab', action: 'new' }); $('sheet').hidden = true; };

// ---------- favorites (same look as the tab list) ----------
let favList = [], currentUrl = '';
const favKey = (u) => (u || '').replace(/#.*$/, '').replace(/\/$/, '');
function renderFavs() {
  const isFav = currentUrl && favList.some((f) => favKey(f.url) === favKey(currentUrl));
  const add = $('fav-add');
  add.textContent = isFav ? '★ Remove page' : '☆ Add page';
  add.classList.toggle('on', !!isFav);
  add.disabled = !currentUrl;
  $('favs-btn').textContent = isFav ? '★' : '☆';
  $('favs-btn').classList.toggle('favadd', true);
  $('favs-btn').classList.toggle('on', !!isFav);
  const list = $('favlist');
  if (!favList.length) {
    const empty = document.createElement('div');
    empty.className = 'tu'; empty.style.cssText = 'text-align:center;padding:24px 0';
    empty.textContent = 'No favorites yet — tap “Add page” to save this one.';
    list.replaceChildren(empty);
    return;
  }
  list.replaceChildren(...favList.map((f) => {
    const row = document.createElement('div');
    row.className = 'trow' + (favKey(f.url) === favKey(currentUrl) ? ' active' : '');
    const fi = document.createElement('div'); fi.className = 'fi';
    const letter = (host(f.url) || f.title || '•')[0];
    if (f.favicon) { const img = document.createElement('img'); img.src = f.favicon; img.onerror = () => { fi.textContent = letter; }; fi.append(img); }
    else fi.textContent = letter;
    const tx = document.createElement('div'); tx.className = 'tx';
    const tt = document.createElement('div'); tt.className = 'tt'; tt.textContent = f.title || f.url;
    const tu = document.createElement('div'); tu.className = 'tu'; tu.textContent = host(f.url);
    tx.append(tt, tu);
    const nt = document.createElement('button'); nt.className = 'x'; nt.textContent = '＋'; nt.setAttribute('aria-label', 'Open in new tab');
    nt.onclick = (e) => { e.stopPropagation(); send({ type: 'fav', action: 'open-new', url: f.url }); $('favsheet').hidden = true; };
    row.onclick = () => { send({ type: 'fav', action: 'open', url: f.url }); $('favsheet').hidden = true; };
    row.append(fi, tx, nt);
    return row;
  }));
}
$('favs-btn').onclick = () => { renderFavs(); $('favsheet').hidden = false; };
$('favsheet-done').onclick = () => { $('favsheet').hidden = true; };
$('favsheet').addEventListener('click', (e) => { if (e.target.id === 'favsheet') $('favsheet').hidden = true; });
$('fav-add').onclick = () => send({ type: 'fav', action: 'toggle' });

// ---------- navigation ----------
$('urlform').addEventListener('submit', (e) => {
  e.preventDefault();
  send({ type: 'nav', action: 'go', input: $('url').value });
  $('url').blur();
});
$('back').onclick = () => send({ type: 'nav', action: 'back' });
$('fwd').onclick = () => send({ type: 'nav', action: 'forward' });
$('reload').onclick = () => send({ type: 'nav', action: 'reload' });

// ---------- typing ----------
const typeBox = $('type');
typeBox.addEventListener('beforeinput', (e) => {
  e.preventDefault();
  if (e.inputType === 'deleteContentBackward') send({ type: 'key', key: 'Backspace' });
  else if (e.inputType === 'insertLineBreak' || e.inputType === 'insertParagraph') send({ type: 'key', key: 'Enter' });
  else {
    const text = e.data ?? e.dataTransfer?.getData('text/plain');
    if (text) send({ type: 'text', text });
  }
});
typeBox.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') { e.preventDefault(); send({ type: 'key', key: 'Enter' }); }
});
$('bksp').onclick = () => send({ type: 'key', key: 'Backspace' });
$('enter').onclick = () => send({ type: 'key', key: 'Enter' });
// Keep keyboard open when tapping the keys
for (const b of [$('bksp'), $('enter')]) b.addEventListener('pointerdown', (e) => e.preventDefault());

// ---------- basic: trackpad ----------
(() => {
  const pad = $('pad');
  let last = null, start = null, fingers = 0, moved = 0, acc = { dx: 0, dy: 0, sx: 0, sy: 0 }, raf = 0;

  const flush = () => {
    raf = 0;
    if (acc.dx || acc.dy) send({ type: 'move', dx: acc.dx, dy: acc.dy });
    if (acc.sx || acc.sy) send({ type: 'scroll', dx: acc.sx, dy: acc.sy });
    acc = { dx: 0, dy: 0, sx: 0, sy: 0 };
  };
  const queue = () => { if (!raf) raf = requestAnimationFrame(flush); };
  const center = (t) => {
    let x = 0, y = 0;
    for (const p of t) { x += p.clientX; y += p.clientY; }
    return { x: x / t.length, y: y / t.length };
  };

  pad.addEventListener('touchstart', (e) => {
    e.preventDefault();
    fingers = Math.max(fingers, e.touches.length);
    last = center(e.touches);
    if (e.touches.length === 1) { start = Date.now(); moved = 0; fingers = 1; }
    pad.classList.add('active');
  }, { passive: false });

  pad.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const c = center(e.touches);
    const dx = c.x - last.x, dy = c.y - last.y;
    last = c;
    moved += Math.abs(dx) + Math.abs(dy);
    if (e.touches.length >= 2) { acc.sx += dx * 2; acc.sy += dy * 2; }
    else {
      // Acceleration: slow moves are precise, fast flicks travel far.
      const speed = Math.hypot(dx, dy);
      const gain = 1.4 + Math.min(speed / 6, 2.6);
      acc.dx += dx * gain; acc.dy += dy * gain;
    }
    queue();
  }, { passive: false });

  pad.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (e.touches.length === 0) {
      if (fingers === 1 && moved < 8 && Date.now() - start < 300) send({ type: 'click' });
      fingers = 0;
      pad.classList.remove('active');
    } else last = center(e.touches);
  }, { passive: false });
})();

// ---------- advanced: mirror ----------
let frameUrl = null;
function showFrame(blob) {
  if (mode !== 'advanced') return;
  const url = URL.createObjectURL(blob);
  const img = $('frame');
  img.onload = () => { if (frameUrl) URL.revokeObjectURL(frameUrl); frameUrl = url; };
  img.src = url;
  $('mirror-hint').hidden = true;
}

(() => {
  const box = $('mirror'), img = $('frame');
  let start = null, last = null, moved = 0;

  // Position on the picture, 0..1. Null if outside it.
  const norm = (t) => {
    const r = img.getBoundingClientRect();
    if (!r.width) return null;
    return { x: (t.clientX - r.left) / r.width, y: (t.clientY - r.top) / r.height, r };
  };

  box.addEventListener('touchstart', (e) => {
    e.preventDefault();
    const t = e.touches[0];
    start = { t: Date.now(), x: t.clientX, y: t.clientY };
    last = { x: t.clientX, y: t.clientY };
    moved = 0;
  }, { passive: false });

  box.addEventListener('touchmove', (e) => {
    e.preventDefault();
    const t = e.touches[0], p = norm(t);
    if (!p) return;
    const dx = t.clientX - last.x, dy = t.clientY - last.y;
    last = { x: t.clientX, y: t.clientY };
    moved += Math.abs(dx) + Math.abs(dy);
    if (moved > 8) send({ type: 'mscroll', x: p.x, y: p.y, dx: dx / p.r.width, dy: dy / p.r.height });
  }, { passive: false });

  box.addEventListener('touchend', (e) => {
    e.preventDefault();
    if (!start || moved >= 8 || Date.now() - start.t > 400) return;
    const p = norm({ clientX: start.x, clientY: start.y });
    if (!p || p.x < 0 || p.x > 1 || p.y < 0 || p.y > 1) return;
    send({ type: 'tap', x: p.x, y: p.y });
    const b = box.getBoundingClientRect();
    const dot = document.createElement('div');
    dot.className = 'ripple';
    dot.style.left = (start.x - b.left) + 'px';
    dot.style.top = (start.y - b.top) + 'px';
    box.appendChild(dot);
    setTimeout(() => dot.remove(), 450);
  }, { passive: false });
})();

connect();
</script>
</body>
</html>
