<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' pb: 'unsafe-inline'; script-src 'self'; img-src data:">
<title>Cinema</title>
<link rel="stylesheet" href="pb://shared/theme.css">
<link rel="stylesheet" href="cinema.css">
</head>
<body class="list">
<div id="top">
  <span class="dot"></span><span id="title">Cinema</span>
  <button id="tolist" class="ic" title="Pick another video">☰</button>
  <button id="swap" class="ic" title="Switch Extract ⇄ Duplicate"></button>
  <button id="pin" class="ic on" title="Keep on top">📌</button>
  <button id="close" class="ic" title="Close Cinema (Esc)">✕</button>
</div>

<!-- 1. pick a video -->
<section id="picker">
  <div id="note" class="note" hidden></div>
  <div id="videos"></div>
  <div id="none" class="none">No videos yet — they’ll show up here as the page loads.</div>
</section>
<div id="loading" class="none" hidden>Loading a copy of the page…<br>☰ cancels</div>

<!-- 2. play it -->
<div id="hit"></div>
<div id="msg" hidden></div>
<div id="big" hidden>
  <div id="bigv"></div>
  <input id="bigr" type="range">
  <div id="chips"></div>
  <div class="hint">scroll to change</div>
</div>
<div id="bar">
  <div class="row">
    <span id="time">0:00</span>
    <div id="track"><div id="ab"></div><div id="fill"></div><input id="seek" type="range" min="0" max="1000" value="0" step="1"></div>
    <span id="dur">0:00</span>
  </div>
  <div class="row">
    <button id="play" class="ic big" title="Play / pause (Space)">▶</button>
    <button id="back10" class="ic" title="Back 10 s (←)">-10</button>
    <button id="fwd10" class="ic" title="Forward 10 s (→)">+10</button>
    <button id="fprev" class="ic" title="Previous frame (,)">‹|</button>
    <button id="fnext" class="ic" title="Next frame (.)">|›</button>
    <button id="a" class="ic" title="Loop from here (A)">A</button>
    <button id="b" class="ic" title="Loop until here (B)">B</button>
    <span class="sp"></span>
    <button id="speed" class="ic knob" data-panel="rate" title="Speed (↑ ↓)"><svg viewBox="0 0 24 24"><path d="M4 6l8 6-8 6zM12 6l8 6-8 6z"/></svg><span id="ratev">1×</span></button>
    <button id="volume" class="ic knob" data-panel="vol" title="Volume, up to 400%"><svg viewBox="0 0 24 24"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 010 7M18.5 6a8.5 8.5 0 010 12" fill="none"/></svg><span id="volv">100%</span></button>
    <label title="Window see-through"><span>◐</span><input id="op" type="range" min="20" max="100" value="100"></label>
    <button id="dl" class="ic" title="Download the video file">⤓</button>
  </div>
</div>
<script type="module" src="cinema.js"></script>
</body>
</html>
