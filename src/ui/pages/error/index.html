<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' pb: 'unsafe-inline'; script-src 'self'">
<title>Can’t reach this page</title>
<link rel="stylesheet" href="pb://shared/theme.css">
<style>
  html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--fg); font: 14px var(--font); }
  main { max-width: 560px; margin: 0 auto; padding: 18vh 28px 40px; }
  .icon { font-size: 40px; margin-bottom: 12px; }
  h1 { font-size: 24px; margin: 0 0 10px; font-weight: 600; }
  p { color: var(--muted); line-height: 1.6; margin: 0 0 8px; }
  code { color: var(--fg); word-break: break-all; }
  ul { color: var(--muted); line-height: 1.8; padding-left: 20px; }
  .code { font: 11px ui-monospace, Menlo, monospace; color: var(--muted); margin-top: 18px; }
  button { margin-top: 22px; height: 34px; padding: 0 18px; border: none; border-radius: 6px; background: var(--accent);
    color: var(--accent-fg); font: inherit; font-weight: 500; }
</style>
</head>
<body>
<main>
  <div class="icon" id="icon">⚠︎</div>
  <h1 id="title">Hmm… can’t reach this page</h1>
  <p id="msg"></p>
  <ul id="tips"></ul>
  <button id="retry">Try again</button>
  <div class="code" id="code"></div>
</main>
<script src="error.js"></script>
</body>
</html>
