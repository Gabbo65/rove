<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src data: https: http: pb:; style-src 'self' pb: 'unsafe-inline'; script-src 'self'">
<title>New Tab</title>
<link rel="stylesheet" href="pb://shared/theme.css">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--page); color: var(--fg); font: 14px var(--font); }
  main { max-width: 720px; margin: 0 auto; padding: 14vh 24px 40px; }
  form { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 18px; background: var(--card);
    border-radius: 24px; box-shadow: 0 2px 10px rgba(0,0,0,.08), 0 0 0 1px var(--border); }
  form:focus-within { box-shadow: 0 2px 14px rgba(0,0,0,.1), 0 0 0 2px var(--accent); }
  form svg { width: 18px; height: 18px; fill: none; stroke: var(--muted); stroke-width: 1.6; stroke-linecap: round; flex: none; }
  input { flex: 1; border: none; outline: none; background: transparent; color: var(--fg); font: inherit; font-size: 16px; }
  #tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 12px; margin-top: 36px; }
  .tile { display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 14px 6px 10px;
    border-radius: 12px; color: var(--fg); text-decoration: none; }
  .tile:hover { background: color-mix(in srgb, var(--card) 70%, transparent); }
  .icon { width: 48px; height: 48px; border-radius: 12px; background: var(--card); display: grid; place-items: center;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); font-weight: 600; font-size: 18px; color: var(--accent); text-transform: uppercase; }
  .icon img { width: 24px; height: 24px; }
  .name { font-size: 12px; max-width: 100%; min-height: 1.2em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #hint { color: var(--muted); font-size: 12px; text-align: center; margin-top: 36px; }
  .private-note { max-width: 520px; margin: 28px auto 0; color: var(--muted); font-size: 13px; line-height: 1.6; text-align: center; }
  [hidden] { display: none !important; }

  /* Customization (Settings → New tab page) */
  #bg { position: fixed; inset: 0; z-index: -1; background-size: cover; background-position: center; }
  #bg::after { content: ''; position: absolute; inset: 0; background: rgba(0,0,0,var(--dim, 0)); }
  .g-rove   { background: linear-gradient(160deg, #1e1b4b, #4338ca 55%, #a78bfa); }
  .g-dusk   { background: linear-gradient(160deg, #2b1055, #7597de); }
  .g-sunset { background: linear-gradient(160deg, #42275a, #ba5370 60%, #f4a261); }
  .g-ocean  { background: linear-gradient(160deg, #0f2027, #203a43 50%, #2c5364); }
  .g-forest { background: linear-gradient(160deg, #134e5e, #71b280); }
  .g-ember  { background: linear-gradient(160deg, #200122, #6f0000 55%, #d4572a); }
  body.has-bg { background: #111; color: #fff; }
  body.has-bg .tile, body.has-bg #hint, body.has-bg .private-note, body.has-bg #greet { color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); }
  body.has-bg .tile:hover { background: rgba(255,255,255,.14); }
  body.has-bg #clock { color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,.45); }
  #clockbox { text-align: center; margin-bottom: 28px; }
  #clock { font-size: 72px; font-weight: 300; letter-spacing: -1px; line-height: 1; font-variant-numeric: tabular-nums; }
  #greet { font-size: 18px; margin-top: 10px; color: var(--muted); }
  body.no-search #tiles { margin-top: 0; }
  #customize { position: fixed; right: 16px; bottom: 16px; display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px;
    border: none; border-radius: 16px; background: color-mix(in srgb, var(--card) 85%, transparent); color: var(--fg); font: inherit;
    font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.15); opacity: .75; cursor: pointer; }
  #customize:hover { opacity: 1; }
  #customize svg { width: 14px; height: 14px; fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
</style>
<link rel="stylesheet" href="pb://shared/look.css" data-look>
</head>
<body class="pg-newtab">
<div id="bg" hidden></div>
<main>
  <div id="clockbox" hidden><div id="clock"></div><div id="greet" hidden></div></div>
  <form id="f">
    <svg viewBox="0 0 16 16"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
    <input id="q" placeholder="Search the web" autocomplete="off">
  </form>
  <div id="tiles"></div>
  <div id="hint" hidden>Your favorites show up here.</div>
  <div class="private-note" id="private-note" hidden>
    <strong>InPrivate</strong><br>
    Pages you visit in this window aren’t saved to history, and cookies, site data and cache are deleted when you close it.
    Downloads and favorites you add are kept. Your internet provider and the sites you visit can still see your activity.
  </div>
</main>
<button id="customize" title="Change background, clock and more"><svg viewBox="0 0 16 16"><path d="M10.5 2.5l3 3-8 8H2.5v-3z"/><path d="M9 4l3 3"/></svg>Customize</button>
<script src="newtab.js"></script>
</body>
</html>
